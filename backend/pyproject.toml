[project]
name = "timetable-backend"
version = "0.1.0"
description = "School Timetable Optimizer – FastAPI backend and CP-SAT solver"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "ortools>=9.10",
    "redis>=5.0",
    "rq>=1.16",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "reportlab>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
